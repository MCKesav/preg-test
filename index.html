
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>NurtureNet - Unified Pregnancy Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      /* Modern CSS API to allow smooth gradient transitions */
      @property --bg-color-stop {
        syntax: '<color>';
        initial-value: #FF6163;
        inherits: true;
      }

      :root {
        --md-sys-color-primary: #ffb4a9;
        --md-sys-color-on-primary: #690005;
        --md-sys-color-surface: #fffbff;
        --md-sys-color-surface-variant: #f5ddd8;
        --bg-color-stop: #FF6163;
      }

      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
        min-height: 100vh;
        background-attachment: fixed;
        /* Gradient uses the animatable variable */
        background-image: linear-gradient(180deg, #FFFFFF 0%, var(--bg-color-stop) 100%);
        /* Extended duration and custom easing for a "premium fade" feel */
        transition: --bg-color-stop 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .font-serif {
        font-family: 'Playfair+Display', serif;
      }
      
      .surface-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 32px -1px rgba(255, 127, 80, 0.05);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Transitions for UI elements, excluding the body to prevent conflicts */
      button, .surface-card, nav {
        transition: background-color 0.4s ease, border-color 0.4s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      }
    </style>
